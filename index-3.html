<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السبحة الإلكترونية</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-gold: #d4af37;
            --accent-gold-hover: #e6c547;
            --border-color: rgba(212, 175, 55, 0.2);
            --button-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            --ripple-color: rgba(212, 175, 55, 0.4);
        }

        [data-theme="light"] {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --accent-gold: #b8860b;
            --accent-gold-hover: #d4af37;
            --border-color: rgba(184, 134, 11, 0.25);
            --button-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            --ripple-color: rgba(184, 134, 11, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.3;
            pointer-events: none;
            z-index: -1;
        }

        .top-bar {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            padding: 8px 14px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .theme-toggle:hover {
            border-color: var(--accent-gold);
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: var(--button-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }

        header h1 {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            color: var(--accent-gold);
            margin-bottom: 12px;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .memorial-box {
            background: rgba(212, 175, 55, 0.05);
            border-right: 3px solid var(--accent-gold);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            width: 100%;
            text-align: center;
        }

        .memorial-box p {
            font-family: 'Amiri', serif;
            font-size: 1.1rem;
            color: var(--accent-gold);
            line-height: 1.6;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.15);
        }

        .dhikr-selector {
            width: 100%;
            margin-bottom: 25px;
        }

        .dhikr-select {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            border-radius: 12px;
            outline: none;
            cursor: pointer;
            text-align: center;
        }

        .dhikr-select:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }

        .current-dhikr-display {
            font-family: 'Amiri', serif;
            font-size: 1.6rem;
            color: var(--accent-gold);
            margin-bottom: 15px;
            min-height: 45px;
            font-weight: 700;
        }

        .counter-wrapper {
            position: relative;
            width: 230px;
            height: 230px;
            margin: 15px auto 25px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform-origin: 50% 50%;
        }

        .tasbeeh-btn {
            width: 195px;
            height: 195px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--card-bg) 0%, var(--bg-color) 100%);
            border: 3px solid var(--accent-gold);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.2), inset 0 0 15px rgba(212, 175, 55, 0.1);
            position: relative;
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .tasbeeh-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4), inset 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .count-number {
            font-family: 'Cairo', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--accent-gold);
            line-height: 1;
            margin-bottom: 5px;
        }

        .target-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .targets-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            width: 100%;
        }

        .target-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 20px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .target-btn.active {
            background-color: var(--accent-gold);
            color: #0b0f19;
            border-color: var(--accent-gold);
            font-weight: 600;
        }

        [data-theme="light"] .target-btn.active {
            color: #ffffff;
        }

        .controls-container {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-action:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .footer-prayer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color);
            width: 100%;
            text-align: center;
        }

        .footer-prayer p {
            font-family: 'Amiri', serif;
            font-size: 1.15rem;
            color: var(--accent-gold);
            letter-spacing: 0.5px;
        }

        .designer-credit {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            text-align: center;
            width: 100%;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: var(--ripple-color);
            transform: scale(0);
            animation: ripple-effect 0.4s linear;
            pointer-events: none;
        }

        @keyframes ripple-effect {
            to {
                transform: scale(2.5);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            header h1 {
                font-size: 1.7rem;
            }
            .counter-wrapper {
                width: 200px;
                height: 200px;
            }
            .tasbeeh-btn {
                width: 170px;
                height: 170px;
            }
            .count-number {
                font-size: 3rem;
            }
        }
    </style>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b0f19">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body data-theme="dark">

    <div class="top-bar">
        <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">
            <span id="themeIcon">☀️</span> <span id="themeText">الوضع الفاتح</span>
        </button>
    </div>

    <div class="container">
        <header>
            <h1>السبحة الإلكترونية</h1>
        </header>

        <div class="memorial-box">
            <p>يرجى الدعاء للمتوفاة<br>مشيرة عبدالجواد إبراهيم</p>
        </div>

        <div class="dhikr-selector">
            <select class="dhikr-select" id="dhikrSelect" onchange="changeDhikr()">
                <option value="سبحان الله">سبحان الله</option>
                <option value="الحمد لله">الحمد لله</option>
                <option value="الله أكبر">الله أكبر</option>
                <option value="لا إله إلا الله">لا إله إلا الله</option>
                <option value="أستغفر الله">أستغفر الله</option>
            </select>
        </div>

        <div class="current-dhikr-display" id="currentDhikrDisplay">سبحان الله</div>

        <div class="counter-wrapper">
            <svg class="progress-ring" width="230" height="230">
                <circle class="progress-ring__circle" stroke="var(--border-color)" stroke-width="4" fill="transparent" r="105" cx="115" cy="115"/>
                <circle class="progress-ring__circle" id="progressCircle" stroke="var(--accent-gold)" stroke-width="5" stroke-linecap="round" fill="transparent" r="105" cx="115" cy="115"/>
            </svg>
            <button class="tasbeeh-btn" id="tasbeehBtn" onclick="incrementCount(event)">
                <span class="count-number" id="countDisplay">0</span>
                <span class="target-label" id="targetLabelDisplay">الهدف: 33</span>
            </button>
        </div>

        <div class="targets-container">
            <button class="target-btn active" onclick="setTarget(33, this)">33</button>
            <button class="target-btn" onclick="setTarget(100, this)">100</button>
            <button class="target-btn" onclick="setTarget(1000, this)">1000</button>
            <button class="target-btn" onclick="setTarget(0, this)">بدون هدف</button>
        </div>

        <div class="controls-container">
            <button class="btn-action" onclick="resetCounter()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                تصفير العداد
            </button>
        </div>

        <div class="footer-prayer">
            <p>اللهم اغفر لها وارحمها</p>
        </div>

        <div class="designer-credit">
            من تصميم Eng. Fouad Fared
        </div>
    </div>

    <footer></footer>

    <script>
        let count = parseInt(localStorage.getItem('tasbeeh_count')) || 0;
        let currentTarget = parseInt(localStorage.getItem('tasbeeh_target')) || 33;
        let currentDhikr = localStorage.getItem('tasbeeh_dhikr') || "سبحان الله";

        const countDisplay = document.getElementById('countDisplay');
        const currentDhikrDisplay = document.getElementById('currentDhikrDisplay');
        const dhikrSelect = document.getElementById('dhikrSelect');
        const targetLabelDisplay = document.getElementById('targetLabelDisplay');
        const progressCircle = document.getElementById('progressCircle');

        const radius = progressCircle.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;
        progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
        progressCircle.style.strokeDashoffset = circumference;

        window.onload = function() {
            dhikrSelect.value = currentDhikr;
            currentDhikrDisplay.textContent = currentDhikr;

            document.querySelectorAll('.target-btn').forEach(btn => {
                if (btn.textContent.trim() == currentTarget || (currentTarget === 0 && btn.textContent.includes('بدون'))) {
                    document.querySelectorAll('.target-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                }
            });

            const savedTheme = localStorage.getItem('tasbeeh_theme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);
            updateThemeButton(savedTheme);

            updateDisplay();
        };

        function incrementCount(event) {
            count++;

            if (navigator.vibrate) {
                navigator.vibrate(40);
            }

            createRipple(event);
            updateDisplay();
            saveData();
        }

        function createRipple(event) {
            const btn = document.getElementById('tasbeehBtn');
            const ripple = document.createElement('span');
            const rect = btn.getBoundingClientRect();

            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${event.clientX - rect.left - size/2}px`;
            ripple.style.top = `${event.clientY - rect.top - size/2}px`;
            ripple.classList.add('ripple');

            btn.appendChild(ripple);
            setTimeout(() => ripple.remove(), 400);
        }

        function updateDisplay() {
            countDisplay.textContent = count;

            if (currentTarget > 0) {
                targetLabelDisplay.textContent = `الهدف: ${currentTarget}`;
                const progress = (count % currentTarget) / currentTarget;
                const offset = circumference - (progress * circumference);
                progressCircle.style.strokeDashoffset = offset;
            } else {
                targetLabelDisplay.textContent = `مفتوح`;
                progressCircle.style.strokeDashoffset = circumference;
            }
        }

        function changeDhikr() {
            currentDhikr = dhikrSelect.value;
            currentDhikrDisplay.textContent = currentDhikr;
            saveData();
        }

        function setTarget(target, element) {
            currentTarget = target;
            document.querySelectorAll('.target-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            updateDisplay();
            saveData();
        }

        function resetCounter() {
            if (confirm("هل أنت متأكد من تصفير العداد؟")) {
                count = 0;
                updateDisplay();
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('tasbeeh_count', count);
            localStorage.setItem('tasbeeh_target', currentTarget);
            localStorage.setItem('tasbeeh_dhikr', currentDhikr);
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('tasbeeh_theme', newTheme);
            updateThemeButton(newTheme);
        }

        function updateThemeButton(theme) {
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            if (theme === 'light') {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'الوضع الداكن';
            } else {
                themeIcon.textContent = '☀️';
                themeText.textContent = 'الوضع الفاتح';
            }
        }
    </script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(console.error);
  });
}
</script>

</body>
</html>
